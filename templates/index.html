<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader Pro | محمل الفيديوهات الشامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; transition: all 0.3s ease; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 { margin-bottom: 8px; font-size: 28px; color: #38bdf8; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .btn-fetch {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-fetch:hover { background: #7dd3fc; transform: translateY(-2px); }
        
        /* قسم معاينة الفيديو */
        .preview-box {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #334155;
        }
        .preview-box img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .video-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #f8fafc; text-align: right; }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .btn-opt {
            background: #1e293b;
            border: 1px solid #3b82f6;
            color: #fff;
            padding: 12px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .btn-opt:hover { background: #2563eb; color: #fff; }
        .btn-opt i { font-size: 18px; }

        /* رسائل الحالة */
        .status-msg { margin-top: 15px; font-size: 14px; font-weight: bold; display: none; }
        .spinner { display: none; margin: 15px auto; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #38bdf8; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h1><i class="fa-solid fa-cloud-arrow-down"></i> محمل الفيديوهات الذكي</h1>
    <p class="subtitle">حمل من يوتيوب، إنستغرام، فيسبوك وتيك توك بأعلى جودة</p>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="ضع رابط الفيديو هنا..." required>
        <button class="btn-fetch" onclick="fetchVideoInfo()"><i class="fa-solid fa-magnifying-glass"></i> جلب</button>
    </div>

    <div class="spinner" id="loader"></div>
    <div class="status-msg" id="statusMsg"></div>

    <!-- كارت المعاينة والخيارات -->
    <div class="preview-box" id="previewBox">
        <img id="thumbImg" src="" alt="Thumbnail">
        <div class="video-title" id="videoTitle"></div>
        
        <p style="font-size: 13px; color: #94a3b8; text-align: right; margin-bottom: 8px;">اختر صيغة التحميل:</p>
        <div class="options-grid">
            <button class="btn-opt" onclick="startDownload('best')">
                <i class="fa-solid fa-film"></i>
                <span>أعلى جودة MP4</span>
            </button>
            <button class="btn-opt" onclick="startDownload('720p')">
                <i class="fa-solid fa-tv"></i>
                <span>جودة HD 720p</span>
            </button>
            <button class="btn-opt" onclick="startDownload('mp3')">
                <i class="fa-solid fa-music"></i>
                <span>صوت فقط MP3</span>
            </button>
        </div>
    </div>
</div>

<script>
    let currentUrl = '';

    async function fetchVideoInfo() {
        const url = document.getElementById('videoUrl').value.trim();
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMsg');
        const previewBox = document.getElementById('previewBox');

        if (!url) {
            alert('يرجى وضع رابط فيديو أولاً!');
            return;
        }

        currentUrl = url;
        loader.style.display = 'block';
        statusMsg.style.display = 'none';
        previewBox.style.display = 'none';

        try {
            const response = await fetch('/fetch-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();
            loader.style.display = 'none';

            if (data.error) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = data.error;
                statusMsg.style.display = 'block';
            } else {
                document.getElementById('thumbImg').src = data.thumbnail;
                document.getElementById('videoTitle').innerText = data.title;
                previewBox.style.display = 'block';
            }
        } catch (err) {
            loader.style.display = 'none';
            statusMsg.style.color = '#ef4444';
            statusMsg.innerText = 'حدث خطأ في الاتصال بالسيرفر!';
            statusMsg.style.display = 'block';
        }
    }

    async function startDownload(quality) {
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMsg');

        loader.style.display = 'block';
        statusMsg.style.color = '#38bdf8';
        statusMsg.innerText = 'جاري التحميل والمعالجة، يرجى الانتظار قليلاً...';
        statusMsg.style.display = 'block';

        try {
            const response = await fetch('/download-media', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: currentUrl, quality: quality })
            });

            const data = await response.json();
            loader.style.display = 'none';

            if (data.error) {
                statusMsg.style.color = '#ef4444';
                statusMsg.innerText = data.error;
            } else {
                statusMsg.style.color = '#22c55e';
                statusMsg.innerText = 'تم التحميل بنجاح! سيتم التنزيل الآن...';
                // فتح رابط التنزيل تلقائياً
                window.location.href = data.download_link;
            }
        } catch (err) {
            loader.style.display = 'none';
            statusMsg.style.color = '#ef4444';
            statusMsg.innerText = 'حدث خطأ أثناء تحميل الملف!';
        }
    }
</script>

</body>
</html>
